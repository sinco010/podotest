<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>알림 발송 (사장님용)</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#fbf6e8;color:#14233f}h1{font-size:20px}label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9a24a;border-radius:10px;font-size:15px;background:#fff}button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:#14233f;color:#f3d27a;font-weight:900;font-size:16px}button.g{background:#fff;color:#14233f;border:1px solid #c9a24a;margin-top:8px}#o{margin-top:14px;padding:10px;background:#fff;border-radius:10px;font-size:14px;white-space:pre-wrap}</style></head><body>
<h1>포도 시세표 알림 발송</h1>
<label>비밀키 (환경변수 SEND_SECRET 값)</label><input id="k" type="password" autocomplete="off">
<label>제목</label><input id="t" value="포도 시세표 업데이트">
<label>내용</label><textarea id="b" rows="3">금일특가 인하 모델이 있어요. 지금 확인하세요</textarea>
<button id="s">전체에게 알림 보내기</button><button class="g" id="c">알림 받는 사람 수 보기</button><div id="o"></div>
<script>
var o=document.getElementById('o');try{document.getElementById('k').value=localStorage.getItem('pk')||''}catch(e){}
function call(p){var k=document.getElementById('k').value.trim();if(!k){o.textContent='비밀키를 입력해주세요.';return}try{localStorage.setItem('pk',k)}catch(e){}
o.textContent='처리 중…';fetch('/.netlify/functions/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({key:k},p))}).then(function(r){return r.json()}).then(function(j){o.textContent=j.ok?(j.subscribers!=null?'알림 받는 사람: '+j.subscribers+'명':'발송 완료\n받는 사람 '+j.total+'명 / 성공 '+j.sent+' / 만료 정리 '+j.removed+' / 실패 '+j.failed):'실패: '+(j.error||'알 수 없음')}).catch(function(){o.textContent='서버에 연결하지 못했어요.'})}
document.getElementById('s').onclick=function(){if(confirm('모든 구독자에게 알림을 보낼까요?'))call({title:document.getElementById('t').value,body:document.getElementById('b').value})};
document.getElementById('c').onclick=function(){call({mode:'count'})};
</script></body></html>
